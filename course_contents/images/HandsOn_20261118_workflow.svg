<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Hands-on workflow: from a Debian base image to bowtie2 alignments and Salmon counts</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>

  <!-- Host -->
  <rect x="20" y="20" width="300" height="520" rx="12" fill="#f3f6fa" stroke="#7a8ca5" stroke-width="1.5"/>
  <text x="170" y="48" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f2d3d">Your machine (host)</text>

  <rect x="45" y="70" width="250" height="56" rx="8" fill="#ffffff" stroke="#7a8ca5"/>
  <text x="170" y="94" text-anchor="middle" fill="#1f2d3d">Docker Hub</text>
  <text x="170" y="114" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#1f2d3d">docker pull debian:latest</text>

  <rect x="45" y="150" width="250" height="56" rx="8" fill="#ffffff" stroke="#7a8ca5"/>
  <text x="170" y="174" text-anchor="middle" fill="#1f2d3d">Dockerfile_salmon</text>
  <text x="170" y="194" text-anchor="middle" font-size="12" fill="#4a5a6e">bowtie2, samtools, gffread, salmon</text>

  <rect x="45" y="230" width="250" height="56" rx="8" fill="#e3edf9" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="170" y="254" text-anchor="middle" fill="#1f2d3d">Image: align_count</text>
  <text x="170" y="274" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#1f2d3d">docker build</text>

  <rect x="45" y="330" width="250" height="76" rx="8" fill="#ffffff" stroke="#7a8ca5"/>
  <text x="170" y="354" text-anchor="middle" fill="#1f2d3d">data/  (mounted read-only)</text>
  <text x="170" y="374" text-anchor="middle" font-size="12" fill="#4a5a6e">E. coli K-12 genome (.fna) + GTF</text>
  <text x="170" y="392" text-anchor="middle" font-size="12" fill="#4a5a6e">paired-end reads (.fastq.gz)</text>

  <rect x="45" y="440" width="250" height="76" rx="8" fill="#eaf6ea" stroke="#3c8d40" stroke-width="1.5"/>
  <text x="170" y="464" text-anchor="middle" fill="#1f2d3d">results/  (mounted read-write)</text>
  <text x="170" y="484" text-anchor="middle" font-size="12" fill="#4a5a6e">aligned.bam, aligned_sorted.bam (+ .bai)</text>
  <text x="170" y="502" text-anchor="middle" font-size="12" fill="#4a5a6e">salmon_quant/quant.sf, quant.genes.sf</text>

  <line x1="170" y1="126" x2="170" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="206" x2="170" y2="228" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Container -->
  <rect x="400" y="20" width="500" height="520" rx="12" fill="#fdf6ec" stroke="#c58a2b" stroke-width="1.5"/>
  <text x="650" y="48" text-anchor="middle" font-weight="bold" font-size="16" fill="#3d2a0f">Container (docker run --rm -v ...)</text>
  <text x="650" y="68" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#3d2a0f">./scripts/align_and_count_nfcore_rnaseq_prok_mode.sh</text>

  <rect x="430" y="86" width="440" height="56" rx="8" fill="#ffffff" stroke="#c58a2b"/>
  <text x="650" y="109" text-anchor="middle" font-weight="bold" fill="#3d2a0f">0. gffread: prepare the transcript sequences</text>
  <text x="650" y="129" text-anchor="middle" font-size="12" fill="#5c4a2e">filter the GTF, genome + GTF → transcripts.fa (+ tx2gene table)</text>

  <rect x="430" y="158" width="440" height="56" rx="8" fill="#ffffff" stroke="#c58a2b"/>
  <text x="650" y="181" text-anchor="middle" font-weight="bold" fill="#3d2a0f">1. bowtie2-build</text>
  <text x="650" y="201" text-anchor="middle" font-size="12" fill="#5c4a2e">generate the bowtie2 index of the transcripts</text>

  <rect x="430" y="230" width="440" height="56" rx="8" fill="#ffffff" stroke="#c58a2b"/>
  <text x="650" y="253" text-anchor="middle" font-weight="bold" fill="#3d2a0f">2. bowtie2 + samtools sort</text>
  <text x="650" y="273" text-anchor="middle" font-size="12" fill="#5c4a2e">align the reads → aligned.bam, sort → aligned_sorted.bam</text>

  <rect x="430" y="302" width="440" height="56" rx="8" fill="#ffffff" stroke="#c58a2b"/>
  <text x="650" y="325" text-anchor="middle" font-weight="bold" fill="#3d2a0f">3. samtools index</text>
  <text x="650" y="345" text-anchor="middle" font-size="12" fill="#5c4a2e">index the sorted BAM → aligned_sorted.bam.bai</text>

  <rect x="430" y="374" width="440" height="56" rx="8" fill="#ffffff" stroke="#c58a2b"/>
  <text x="650" y="397" text-anchor="middle" font-weight="bold" fill="#3d2a0f">4. salmon quant</text>
  <text x="650" y="417" text-anchor="middle" font-size="12" fill="#5c4a2e">count reads per transcript and gene from aligned.bam</text>

  <line x1="650" y1="142" x2="650" y2="156" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="650" y1="214" x2="650" y2="228" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="650" y1="286" x2="650" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="650" y1="358" x2="650" y2="372" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Host to container -->
  <path d="M295,258 C350,258 360,114 428,114" fill="none" stroke="#2f6db5" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="352" y="200" text-anchor="middle" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#2f6db5">run</text>
  <path d="M295,368 C360,368 360,258 428,258" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="352" y="330" text-anchor="middle" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#444">-v data:ro</text>
  <path d="M650,430 C650,478 360,478 297,478" fill="none" stroke="#3c8d40" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="470" text-anchor="middle" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3c8d40">-v results</text>
</svg>
